
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d0a">
  <meta name="description" content="EMMY AI - Tu inteligencia artificial personal">
  <title>EMMY AI</title>
  <link rel="icon" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="./">
        <span class="brand-mark">E</span>
        <span>EMMY <b>AI</b></span>
      </a>
      <button class="new-chat" id="newChat">+ Nuevo chat</button>
      <div class="side-label">TU ESPACIO</div>
      <p class="side-note">Tu inteligencia artificial personal.</p>
      <div class="sidebar-bottom">
        <span class="status-dot"></span> EMMY AI activa
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <span class="brand-mark">E</span>
        <strong>EMMY AI</strong>
        <span class="online">● En línea</span>
      </header>

      <section class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
          <div class="hero-icon">E</div>
          <h1>Hola, soy <span>EMMY AI</span></h1>
          <p>Tu inteligencia artificial personal.<br>¿Qué quieres hacer hoy?</p>
          <div class="suggestions">
            <button class="suggestion">💡 Dame ideas para un negocio</button>
            <button class="suggestion">✍️ Ayúdame a escribir</button>
            <button class="suggestion">💻 Ayúdame con programación</button>
          </div>
        </div>
      </section>

      <form class="chat-form" id="chatForm">
        <input id="userInput" type="text"
          placeholder="Pregúntale algo a EMMY AI..."
          autocomplete="off">
        <button type="submit" aria-label="Enviar">➤</button>
      </form>

      <footer>EMMY AI · Tu inteligencia, sin límites.</footer>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
