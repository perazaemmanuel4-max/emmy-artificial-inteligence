<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>EMMY AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #173d24;
    }

    header h1 {
      color: #39ff14;
      margin: 0;
      font-size: 30px;
    }

    header p {
      color: #aaa;
      margin-bottom: 0;
    }

    #chat {
      height: calc(100dvh - 160px);
      overflow-y: auto;
      padding: 15px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 12px;
      background: #111;
      border-top: 1px solid #222;
    }

    #user-input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #202020;
      color: white;
      font-size: 16px;
    }

    #send-btn {
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: #39ff14;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <h1>EMMY AI</h1>
    <p>Tu inteligencia artificial personal</p>
  </header>

  <main id="chat">
    <div>
      Hola, soy EMMY AI. ¿En qué puedo ayudarte?
    </div>
  </main>

  <div class="input-area">
    <input
      id="user-input"
      type="text"
      placeholder="Escribe a EMMY AI..."
      autocomplete="off"
    >

    <button id="send-btn">Enviar</button>
  </div>

  <script src="app.js"></script>

</body>
</html>
